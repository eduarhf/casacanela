<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASA CANELA - Pusher</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
          --crema:#F9F3EB; --card:#FFFCF7; --cafe:#3E2A1A; --suave:#8A6D52;
          --btn:#EDE0CE; --btn-hover:#E5D5BC; --wa:#25D366;
          --sombra:0 10px 28px rgba(62,42,26,.12)
        }
        body{background:var(--crema);color:var(--cafe);font-family:Inter,sans-serif;padding-bottom:140px}
        /* MENU TRANSPARENTE - TU MISMO */
        .header{position:sticky;top:0;z-index:20;background:rgba(249,243,235,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(62,42,26,.07)}
        .nav{max-width:480px;margin:auto;height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
        .logo{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.22em;font-weight:500}
        .icon{width:36px;height:36px;display:grid;place-items:center}
        .icon svg{width:24px;height:24px;stroke:var(--cafe);stroke-width:1.5;fill:none;stroke-linecap:round}
        /* PRODUCTOS DEMO */
        .wrap{max-width:480px;margin:auto;padding:10px 20px}
        h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;margin:28px 0 14px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .card{background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--sombra)}
        .card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}
        .card h3{font-size:14px;font-weight:500;margin-top:10px}
        .price{font-size:16px;font-weight:600;margin-top:6px}
        .add{width:100%;margin-top:10px;background:var(--btn);color:var(--cafe);font-size:13px;font-weight:500;padding:11px;border-radius:10px;border:0;cursor:pointer}
        /* ===== PUSHER - EL QUE EMPUJA ===== */
        .pusher{
          position:fixed;left:50%;transform:translate(-50%,120%);bottom:16px;z-index:40;
          width:calc(100% - 32px);max-width:448px;
          background:var(--card);border:1px solid #F1E9DB;border-radius:16px;
          box-shadow:0 16px 32px rgba(62,42,26,.18);
          padding:14px;display:flex;gap:12px;align-items:center;
          transition:transform .45s cubic-bezier(.2,.9,.3,1.1);
        }
        .pusher.show{transform:translate(-50%,0)}
        .pusher img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex-shrink:0}
        .pusher-text{flex:1;text-align:left}
        .pusher-text b{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;letter-spacing:.02em;display:block}
        .pusher-text span{font-size:12px;color:var(--suave);display:block;margin-top:2px}
        .pusher-btns{display:flex;flex-direction:column;gap:6px}
        .pusher .go{background:var(--btn);color:var(--cafe);font-size:12px;font-weight:600;padding:9px 14px;border-radius:999px;border:0;cursor:pointer;white-space:nowrap}
        .pusher .close{font-size:11px;color:var(--suave);background:none;border:0;cursor:pointer}
        /* BARRA CARRITO CLARA */
        .cart-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:25;width:calc(100% - 32px);max-width:448px;background:var(--btn);color:var(--cafe);border-radius:999px;padding:15px 20px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;box-shadow:var(--sombra)}
        .cart-bar.hidden{opacity:0;pointer-events:none}
        /* WHATSAPP */
        .wa{position:fixed;right:16px;bottom:84px;z-index:30;width:52px;height:52px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 20px rgba(0,0,0,.18)}
        .wa svg{width:28px;height:28px;fill:#fff}
    </style>
</head>
<body>

<header class="header"><div class="nav">
    <button class="icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a href="#" class="logo">CASA CANELA</a>
    <div class="nav-right" style="display:flex"><button class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button><button class="icon"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg></button></div>
</div></header>

<main class="wrap">
    <h2>Granola</h2>
    <div class="grid">
        <div class="card"><img src="granola-artesanal.jpg"><h3>Granola Artesanal</h3><div class="price">$4.200</div><button class="add" onclick="showPusher()">Agregar +</button></div>
        <div class="card"><img src="granola-frutos-rojos.jpg"><h3>Granola Frutos Rojos</h3><div class="price">$4.300</div><button class="add" onclick="showPusher()">Agregar +</button></div>
    </div>
    <h2>Frutos Secos</h2>
    <div class="grid">
        <div class="card"><img src="almendras.jpg"><h3>Almendras</h3><div class="price">$4.500</div><button class="add" onclick="showPusher()">Agregar +</button></div>
        <div class="card"><img src="nueces.jpg"><h3>Nueces</h3><div class="price">$5.000</div><button class="add" onclick="showPusher()">Agregar +</button></div>
    </div>
</main>

<!-- PUSHER -->
<div class="pusher" id="pusher">
    <img src="granola-artesanal.jpg" alt="Granola">
    <div class="pusher-text">
        <b>¿La llevamos?</b>
        <span>Granola Artesanal • $4.200 • ★ MÁS VENDIDA</span>
    </div>
    <div class="pusher-btns">
        <button class="go" onclick="goCart()">Ver carrito →</button>
        <button class="close" onclick="hidePusher()">Ahora no</button>
    </div>
</div>

<!-- BARRA CARRITO -->
<div class="cart-bar" id="cartBar"><span>Ver carrito • 1 producto</span><span>$4.200 →</span></div>

<a class="wa" href="https://wa.me/569XXXXXXXX"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.6 12.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.9 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4 0-.5.2-.7l.4-.5c.1-.2.1-.3 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.9 2.9 4.6 4 .6.3 1.1.4 1.5.6.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.5-.3z"/></svg></a>

<script>
    const pusher = document.getElementById('pusher');
    const cartBar = document.getElementById('cartBar');
    function showPusher(){
      pusher.classList.add('show');
      cartBar.classList.add('hidden');
      // Se esconde solo a los 5 seg si no lo aprieta
      setTimeout(()=>{ if(pusher.classList.contains('show')) hidePusher(); }, 5000);
    }
    function hidePusher(){
      pusher.classList.remove('show');
      cartBar.classList.remove('hidden');
    }
    function goCart(){
      // Acá va tu flujo: Instagram -> Web -> WhatsApp / Checkout
      window.location.href = 'https://wa.me/569XXXXXXXX?text=Hola!%20Quiero%20pedir%20Granola%20Artesanal%20$4.200';
    }
</script>
</body>
</html>
