<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASA CANELA - Artesanal • Chile</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
          --crema:#F9F3EB;
          --crema-2:#FFFDF9;
          --cafe:#3E2A1A;
          --cafe-claro:#8A6D52;
          --borde:#EDE3D3;
          --sombra:0 12px 30px rgba(62,42,26,.07);
        }
        body{
          background:var(--crema);
          color:var(--cafe);
          font-family:'Inter',sans-serif;
          -webkit-font-smoothing:antialiased;
        }
        a{color:inherit;text-decoration:none}
        button{font-family:inherit;cursor:pointer;border:0;background:none}

        /* ===== CABECERA - SOLO NAVEGACIÓN ===== */
        .header{
          position:sticky;top:0;z-index:10;
          background:rgba(249,243,235,.92);
          backdrop-filter:blur(10px);
          border-bottom:1px solid var(--borde);
        }
        .nav{
          max-width:480px;margin:0 auto;
          height:72px;padding:0 20px;
          display:flex;align-items:center;justify-content:space-between;
        }
        .icon-btn{width:32px;height:32px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--cafe)}
        .logo{text-align:center;line-height:1}
        .logo b{
          font-family:'Cormorant Garamond',serif;
          font-weight:500;font-size:28px;letter-spacing:.12em;
        }
        .logo span{
          display:block;margin-top:4px;
          font-size:8px;letter-spacing:.42em;color:var(--cafe-claro);
        }
        .nav-right{display:flex;gap:4px;align-items:center}

        /* ===== HERO - SOLO FOTO ===== */
        .hero{max-width:480px;margin:0 auto;padding:28px 20px 10px}
        .hero-img{
          width:100%;aspect-ratio:4/5;object-fit:cover;
          display:block;border-radius:2px;
          box-shadow:var(--sombra);
        }
        .hero-space{height:42px}

        /* ===== SECCIONES PRODUCTOS ===== */
        .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px}
        .section{margin-top:44px}
        .section h2{
          font-family:'Cormorant Garamond',serif;
          font-weight:500;font-size:42px;line-height:1;
          margin-bottom:20px;letter-spacing:-.01em;
        }
        .grid{
          display:grid;grid-template-columns:1fr 1fr;gap:16px;
        }
        .grid.single{grid-template-columns:1fr;max-width:280px;margin:0 auto}
        .card{
          background:var(--crema-2);
          border-radius:14px;overflow:hidden;
          box-shadow:var(--sombra);
          border:1px solid #F1E9DB;
          text-align:center;padding:18px 14px 18px;
          transition:transform .2s;
        }
        .card:active{transform:scale(.98)}
        .card img{
          width:100%;aspect-ratio:1/1;object-fit:cover;
          border-radius:8px;background:#F3EBDD;
        }
        .card h3{
          margin-top:16px;font-size:14px;font-weight:400;letter-spacing:.02em;
        }
        .card p{margin-top:6px;font-size:14px;color:var(--cafe);font-weight:500}
        .card .desc{font-size:11px;color:var(--cafe-claro);font-weight:300;margin-top:4px;line-height:1.4}

        /* Botón flotante carrito - discreto, no tapa */
        .cart-float{
          position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
          background:var(--cafe);color:#fff;
          padding:14px 22px;border-radius:999px;
          font-size:13px;letter-spacing:.02em;
          box-shadow:0 12px 24px rgba(0,0,0,.18);
          display:none; /* se muestra con JS cuando hay productos */
        }
        .cart-float.show{display:block}

        @media(min-width:520px){
          .hero,.wrap,.nav{max-width:520px}
        }
    </style>
</head>
<body>

<!-- CABECERA -->
<header class="header">
    <div class="nav">
        <button class="icon-btn" aria-label="Menú">☰</button>
        <a href="#" class="logo">
            <b>CASA CANELA</b>
            <span>ARTESANAL • CHILE</span>
        </a>
        <div class="nav-right">
            <button class="icon-btn" aria-label="Buscar">⌕</button>
            <button class="icon-btn" aria-label="Carrito">🛒</button>
        </div>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <!-- Cambia esta imagen por la tuya -->
    <img class="hero-img" src="https://images.unsplash.com/photo-1517093156756-b8e9d2f1b1e1?q=80&w=1000&auto=format&fit=crop" alt="Granola Artesanal Casa Canela">
    <div class="hero-space"></div>
</section>

<main class="wrap">

    <!-- GRANOLA -->
    <section class="section">
        <h2>Granola</h2>
        <div class="grid">
            <a href="#" class="card">
                <img src="https://images.unsplash.com/photo-1517093156756-b8e9d2f1b1e1?q=80&w=600&auto=format&fit=crop" alt="Granola Clásica">
                <h3>Granola Clásica</h3>
                <p>$5.900</p>
            </a>
            <a href="#" class="card">
                <img src="https://images.unsplash.com/photo-1574869408661-2a5d3e5e0e1a?q=80&w=600&auto=format&fit=crop" alt="Granola Cacao">
                <h3>Granola Cacao</h3>
                <p>$6.200</p>
            </a>
        </div>
    </section>

    <!-- FRUTOS SECOS -->
    <section class="section">
        <h2>Frutos Secos</h2>
        <div class="grid">
            <a href="#" class="card">
                <img src="https://images.unsplash.com/photo-1508061253366-f7da158b6d46?q=80&w=600&auto=format&fit=crop" alt="Almendras">
                <h3>Almendras</h3>
                <p>$4.500</p>
            </a>
            <a href="#" class="card">
                <img src="https://images.unsplash.com/photo-1508747703725-719777637510?q=80&w=600&auto=format&fit=crop" alt="Nueces">
                <h3>Nueces</h3>
                <p>$5.000</p>
            </a>
        </div>
    </section>

    <!-- DÚOS Y PACKS -->
    <section class="section">
        <h2>Dúos y Packs</h2>
        <div class="grid single">
            <a href="#" class="card">
                <img src="https://images.unsplash.com/photo-1517093156756-b8e9d2f1b1e1?q=80&w=600&auto=format&fit=crop" alt="Dúo Artesanal">
                <h3>Dúo Artesanal — Pack de 2 Frascos</h3>
                <p class="desc">El regalo perfecto. Granola + Frutos Secos.</p>
                <p>$10.900</p>
            </a>
        </div>
    </section>

</main>

<button class="cart-float" id="cartBtn">Ver carrito • $0</button>

<script>
    // Ejemplo simple: al hacer click en un producto, muestra el carrito
    const btn = document.getElementById('cartBtn');
    document.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', (e)=>{
        e.preventDefault();
        btn.classList.add('show');
        btn.textContent = 'Ver carrito • 1 producto';
      });
    });
</script>
</body>
</html>
