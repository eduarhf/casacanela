<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--beige:#F2EBE0;--blanco:#FFF;--cafe:#4A2C1A;--oro:#C9A227;--cafe-claro:#8B6F4E;--borde:#E8DDCC}
body{background:var(--beige);font-family:'Inter',sans-serif;color:var(--cafe)}
header{background:var(--beige);padding:22px 16px 14px;text-align:center;position:sticky;top:0;z-index:20}
header h1{font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:4px;line-height:1}

.mini-sub{text-align:center;font-size:13px;color:var(--cafe-claro);padding:0 16px 12px}
.chips-wrap{position:sticky;top:78px;z-index:19;background:var(--beige);padding:8px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}

.card{background:var(--blanco);border-radius:20px;overflow:hidden;border:1px solid var(--borde);display:flex;flex-direction:column}

.card-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-body h3{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.1}
.card-body span{font-size:12px;color:var(--cafe-claro)}
.price{font-weight:700;font-size:15px;margin-top:6px}
.price small{color:var(--oro);font-size:11px}
.btn{margin-top:10px;background:var(--cafe);color:#fff;border:none;padding:11px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.wa{position:fixed;right:16px;bottom:24px;z-index:30;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.cart-bar{position:fixed;left:16px;right:84px;bottom:24px;z-index:30;background:var(--cafe);color:#fff;padding:14px 16px;border-radius:999px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);cursor:pointer}

<body>
<header><h1>CASA CANELA</h1><p>Granola Artesanal • Santiago</p></header>

<a class="wa" href="https://wa.me/56900000000?text=Hola%20Casa%20Canela%20Foods!" target="_blank">💬</a>
<script>
const FALLBACK="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80";
const PRODUCTOS=[
{id:1,nombre:"Granola Clásica",cat:"Granola",detalle:"500g • Miel y avena",precio:6500,img:"https://images.unsplash.com/photo-1517684601621-8f6e58c5f7e5?w=600&q=80"},
{id:2,nombre:"Granola Cacao",cat:"Granola",detalle:"500g • Chocolate 70%",precio:6900,img:"https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=600&q=80"},
{id:3,nombre:"Almendras",cat:"Frutos Secos",detalle:"250g • Tostadas",precio:5900,img:"https://images.unsplash.com/photo-1599599810769-bcde5a160d32?w=600&q=80"},
{id:4,nombre:"Nueces",cat:"Frutos Secos",detalle:"250g • Sin cáscara",precio:6200,img:"https://images.unsplash.com/photo-1508061253366-f7da158b6d46?w=600&q=80"},
{id:5,nombre:"Mix Trail",cat:"Frutos Secos",detalle:"300g • Mix energético",precio:5800,img:"https://images.unsplash.com/photo-1596591606975-97ee5cef3a1e?w=600&q=80"},
{id:6,nombre:"Granola Berry",cat:"Granola",detalle:"500g • Frutos rojos",precio:7200,img:"https://images.unsplash.com/photo-1517684601621-8f6e58c5f7e5?w=600&q=80"}
];
const CATS=["Todos","Granola","Frutos Secos"];
const Store={state:{filtro:"Todos",cart:{}},listeners:[],setFiltro(f){this.state.filtro=f;this.notify()},add(id){this.state.cart[id]=(this.state.cart[id]||0)+1;this.notify()},subscribe(fn){this.listeners.push(fn)},notify(){this.listeners.forEach(fn=>fn(this.state))}};
const chipsEl=document.getElementById('chips');const gridEl=document.getElementById('grid');const cartBar=document.getElementById('cartBar');
function render(state){
chipsEl.innerHTML=CATS.map(c=>`<button class="chip ${c===state.filtro?'active':''}" onclick="Store.setFiltro('${c}')">${c}</button>`).join('');
const list=PRODUCTOS.filter(p=>state.filtro==="Todos"||p.cat===state.filtro);
gridEl.innerHTML=list.map(p=>`<article class="card"><div class="card-img"><img src="${p.img}" alt="" onerror="this.onerror=null;this.src='${FALLBACK}'"></div><div class="card-body"><h3>${p.nombre}</h3><span>${p.detalle}</span><div class="price">$${p.precio.toLocaleString('es-CL')} <small>• ${p.cat}</small></div><button class="btn" onclick="Store.add(${p.id})">Agregar +</button></div></article>`).join('');
const totalQty=Object.values(state.cart).reduce((a,b)=>a+b,0);
const totalPrice=Object.entries(state.cart).reduce((acc,[id,qty])=>{const prod=PRODUCTOS.find(p=>p.id==id);return acc+prod.precio*qty},0);
if(totalQty===0){cartBar.innerHTML='';cartBar.style.display='none'}else{cartBar.style.display='flex';cartBar.innerHTML=`<span>🛒 ${totalQty} productos</span><span>$${totalPrice.toLocaleString('es-CL')} • Pedir</span>`;cartBar.onclick=()=>{let msg="Hola Casa Canela Foods! Quiero pedir:%0A";Object.entries(state.cart).forEach(([id,qty])=>{const prod=PRODUCTOS.find(p=>p.id==id);msg+=`- ${prod.nombre} x${qty} - $${(prod.precio*qty).toLocaleString('es-CL')}%0A`});msg+=`Total: $${totalPrice.toLocaleString('es-CL')}`;window.open(`https://wa.me/56900000000?text=${msg}`,'_blank')}}}
Store.subscribe(render);render(Store.state);
</script>
