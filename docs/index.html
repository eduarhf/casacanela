<style>
:root{--fondo:#FAF7F0;--card:#FFF;--cafe:#6E4E33;--cafe-dark:#4A3320;--gris:#6B5846;--borde:#EBDDCB;--borde-oscuro:#D9C6AC;--crema:#F3EBDD;--wa:#25D366;--radio:16px;--sombra:0 6px 18px rgba(110,78,51,.07)}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--fondo);color:var(--cafe);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:110px;overflow-x:hidden}body.has-dock{padding-bottom:180px}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;min-height:44px}img{max-width:100%;display:block}
.sticky-top{position:sticky;top:0;z-index:30;background:var(--fondo)}
.omni-bar{background:var(--cafe);color:#fff;text-align:center;font-size:11px;padding:6px 12px 7px;font-weight:600}.omni-bar .barra{height:3px;background:rgba(255,255,255,.25);border-radius:999px;margin:5px auto 0;max-width:160px;overflow:hidden}.omni-bar .fill{height:100%;background:#fff;border-radius:999px;transition:width .4s;width:0%}
.site-header{background:rgba(250,247,240,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--borde)}
.nav{max-width:520px;margin:0 auto;height:60px;padding:0 10px;display:flex;align-items:center;justify-content:space-between}.nav-spacer{width:44px;height:44px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;position:relative}.icon-btn svg{width:24px;height:24px;stroke:var(--cafe-dark);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cart-count{position:absolute;top:2px;right:2px;background:var(--cafe);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 4px;border-radius:999px;display:grid;place-items:center}.cart-count:empty{display:none}
.logo{text-align:center;line-height:1;flex:1}.logo strong{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;letter-spacing:2.6px;color:var(--cafe-dark)}.logo small{display:block;margin-top:2px;font-size:9px;letter-spacing:3.6px;color:#7A6550;font-weight:600}
.chips{padding:9px 6px;display:flex;gap:6px}.chip{flex:1;min-width:0;min-height:36px;padding:0 6px;border-radius:999px;background:#fff;border:1.5px solid var(--borde-oscuro);font-size:12.5px;font-weight:700;color:var(--cafe-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip.active{background:var(--cafe);color:#fff;border-color:var(--cafe)}
.wrap{max-width:520px;margin:0 auto;padding:8px 2px 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-box{background:var(--card);border-radius:var(--radio);border:1px solid var(--borde);box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column}.card-media{position:relative;line-height:0;cursor:pointer}.card-media img{width:100%;height:158px;object-fit:cover}.badge{position:absolute;top:8px;left:8px;background:#fff;color:var(--cafe-dark);font-size:9.5px;font-weight:800;padding:5px 8px;border-radius:999px}
.card-body{padding:10px 10px 11px}.card-body h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:var(--cafe-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.card-body .detalle{font-size:12px;color:var(--gris);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.price{font-weight:800;font-size:19px;color:var(--cafe-dark)}.price small{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--gris)}
.btn-plus{width:38px;height:38px;min-height:38px;border-radius:50%;background:var(--cafe);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center}
.info-box{margin-top:20px;background:#fff;border:1px solid var(--borde);border-radius:var(--radio);padding:18px;text-align:center;margin-left:4px;margin-right:4px}.info-box b{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--cafe-dark)}.info-box p{font-size:13px;color:var(--gris);margin-top:6px}.info-box a{display:inline-flex;min-height:44px;align-items:center;margin-top:10px;background:#F2EBE0;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700}
.wa-float{position:fixed;right:10px;bottom:18px;z-index:25}.wa-float.hide{opacity:0;pointer-events:none}.wa-btn{width:46px;height:46px;border-radius:50%;background:var(--wa);display:grid;place-items:center;border:2px solid #fff}.wa-btn svg{width:23px;height:23px;fill:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--borde);padding:10px 12px 10px;transform:translateY(120%);transition:transform .35s}.dock.show{transform:translateY(0)}.dock-btn{width:100%;max-width:520px;margin:0 auto;display:flex;justify-content:space-between;background:var(--cafe);color:#fff;border-radius:999px;padding:0 16px;min-height:52px;font-size:14px;font-weight:800}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--cafe-dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{opacity:1}
.cart-overlay,.detail-overlay{position:fixed;inset:0;background:rgba(74,51,32,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}.cart-overlay.open,.detail-overlay.open{opacity:1;pointer-events:auto}.detail-overlay{z-index:60}
.cart-drawer,.detail-drawer{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;z-index:51;width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:20px;transition:transform .4s;max-height:86vh;overflow-y:auto}.cart-drawer.open,.detail-drawer.open{transform:translate(-50%,0)}.detail-drawer{z-index:61;padding:0 0 20px;max-height:88vh}
.cart-head{display:flex;justify-content:space-between;margin-bottom:16px}.cart-head b{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--cafe-dark)}.cart-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--borde)}.cart-item img{width:56px;height:56px;object-fit:cover;border-radius:10px}.cart-item-info{flex:1}.cart-item-info b{font-size:13px;color:var(--cafe-dark)}.cart-item-info span{font-size:12px;color:var(--gris)}.qty{display:flex;gap:8px;margin-top:8px}.qty button{height:36px;width:36px;border-radius:50%;background:#F2EBE0;font-size:18px;font-weight:700;display:grid;place-items:center}.qty span{font-size:13px;font-weight:700}.cart-item-total{font-size:13px;font-weight:800;text-align:right}.cart-remove{font-size:12px;color:var(--gris);text-decoration:underline}.cart-empty{text-align:center;padding:30px 0;color:var(--gris);font-size:13px}.cart-row{display:flex;justify-content:space-between;font-size:13px;color:var(--gris);padding:4px 0}.cart-row.total{font-size:16px;font-weight:800;color:var(--cafe-dark);border-top:1px solid var(--borde);padding-top:12px;margin-top:8px}.btn-wa{width:100%;background:var(--wa);color:#fff;font-size:15px;font-weight:800;min-height:52px;border-radius:12px;margin-top:14px}.btn-clear{width:100%;font-size:12px;color:var(--gris);margin-top:10px;text-decoration:underline}
/* Hoja SHEIN - solo funcionalidad variante */
.detail-img{width:100%;height:220px;object-fit:cover}.detail-body{padding:16px 20px 0}.detail-body h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--cafe-dark)}.detail-label{font-size:12px;font-weight:800;margin:16px 0 8px;text-transform:uppercase}.gram-pills{display:flex;gap:8px;flex-wrap:wrap}.gram-pill{flex:1;min-width:70px;min-height:46px;border-radius:12px;border:1.5px solid var(--borde-oscuro);background:#fff}.gram-pill b{display:block;font-size:14px}.gram-pill span{font-size:11px;color:var(--gris)}.gram-pill.active{border-color:var(--cafe);background:var(--crema)}
.detail-add{width:100%;background:var(--cafe-dark);color:#fff;font-size:15px;font-weight:800;min-height:52px;border-radius:12px;margin-top:18px}
@media(min-width:640px){.nav,.wrap{max-width:1100px}.grid{grid-template-columns:repeat(3,1fr)}.card-media img{height:200px}}
</style>
</head>

<script>
const CONFIG={phone:"56935820289",instagram:"casacanela.foods",envioGratisDesde:30000};
const waBase="https://wa.me/"+CONFIG.phone;
const PRODUCTOS=[
{id:"granola-artesanal",nombre:"Granola Clásica",badge:"MÁS VENDIDO",descripcion:"Miel y avena",detalle:"Horneada en pequeños lotes. Miel natural, avena crocante.",imagen:"./granola-artesanal.webp?v=73",categoria:"Granola",variantes:[{gramaje:"250g",precio:4200},{gramaje:"500g",precio:6500},{gramaje:"1kg",precio:14900}]},
{id:"granola-cacao",nombre:"Granola Cacao",badge:"",descripcion:"Chocolate 70%",detalle:"Cacao 70% real. Intensa, crocante.",imagen:"./granola-cacao.webp?v=73",categoria:"Granola",variantes:[{gramaje:"250g",precio:6200},{gramaje:"500g",precio:6900},{gramaje:"1kg",precio:21900}]},
{id:"almendras",nombre:"Almendras",badge:"",descripcion:"Tostadas",detalle:"Tostadas al punto, sin sal agregada.",imagen:"./almendras.webp?v=73",categoria:"Frutos Secos",variantes:[{gramaje:"250g",precio:4500},{gramaje:"500g",precio:8500},{gramaje:"1kg",precio:15900}]},
{id:"nueces",nombre:"Nueces",badge:"",descripcion:"Sin cáscara",detalle:"Frescas y sin amargor.",imagen:"./nueces.webp?v=73",categoria:"Frutos Secos",variantes:[{gramaje:"250g",precio:5000},{gramaje:"500g",precio:9500},{gramaje:"1kg",precio:17900}]},
{id:"duo-artesanal",nombre:"Dúo Artesanal",badge:"",descripcion:"Pack de 2 Frascos",detalle:"Pack de 2 frascos para compartir.",imagen:"./duo.webp?v=73",categoria:"Dúos y Packs",variantes:[{gramaje:"2x250g",precio:10900},{gramaje:"2x500g",precio:19900}]}
];
const $=s=>document.querySelector(s); const fmt=n=>"$"+n.toLocaleString("es-CL");
const findProducto=id=>PRODUCTOS.find(p=>p.id===id);
const parseKey=key=>{const [id,i]=String(key).split("::"); const p=findProducto(id); const idx=parseInt(i)||0; return {p,v:p?p.variantes[idx]:null,idx};};
function showToast(t){const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1400);}
const Store=(()=>{ let state={cart:(()=>{try{return JSON.parse(localStorage.getItem("casa_canela_cart")||"[]")}catch(e){return []}})(),selected:Object.fromEntries(PRODUCTOS.map(p=>{const i=p.variantes.findIndex(v=>v.gramaje==="500g"); return [p.id,i>=0?i:0];})),categoria:"Todos",detailId:null,detailQty:1}; let ls=[]; const save=()=>{try{localStorage.setItem("casa_canela_cart",JSON.stringify(state.cart))}catch(e){}}; return{ getState:()=>state,subscribe:f=>ls.push(f),notify:()=>ls.forEach(f=>f()), setCategoria(c){state.categoria=c; this.notify()}, setVariante(id,idx){state.selected[id]=idx; this.notify()}, add(id,qty=1){const idx=state.selected[id]||0; const key=id+"::"+idx; const it=state.cart.find(i=>i.key===key); const p=findProducto(id); const v=p.variantes[idx]; if(it) it.qty+=qty; else state.cart.push({key,qty,precio:v.precio,nombre:p.nombre,gramaje:v.gramaje}); save(); this.notify()}, changeQty(key,d){const it=state.cart.find(i=>i.key===key); if(it) it.qty+=d; state.cart=state.cart.filter(i=>i.qty>0); save(); this.notify()}, remove(key){state.cart=state.cart.filter(i=>i.key!==key); save(); this.notify()}, clear(){state.cart=[]; save(); this.notify()}, totalItems(){return state.cart.reduce((s,i)=>s+i.qty,0)}, totalPrecio(){return state.cart.reduce((s,i)=>s+(parseKey(i.key).v?.precio||i.precio||0)*i.qty,0)}, openDetail(id){state.detailId=id; state.detailQty=1; this.notify(); View.openDetailUI()}, closeDetail(){state.detailId=null; this.notify(); View.closeDetailUI()}, setDetailQty(q){state.detailQty=Math.max(1,q); this.notify()} }; })();
const View=(()=>{ function pintarProductos(){ const {categoria,selected}=Store.getState(); const items=PRODUCTOS.filter(p=>categoria==="Todos"||p.categoria===categoria); $("#tienda").innerHTML=`<div class="grid">`+items.map(p=>{ const v=p.variantes[selected[p.id]||0]; return `<article><div class="card-box"><div class="card-media" data-open="${p.id}"><img src="${p.imagen}" loading="lazy">${p.badge?`<span class="badge">${p.badge}</span>`:""}</div><div class="card-body"><h3 data-open="${p.id}">${p.nombre}</h3><span class="detalle">${p.descripcion}</span><div class="card-foot"><div class="price">${fmt(v.precio)}<small>${v.gramaje}</small></div><button class="btn-plus" data-open="${p.id}">+</button></div></div></div></article>`; }).join("")+`</div>`; }
function pintarBarra(){ const total=Store.totalPrecio(); const falta=CONFIG.envioGratisDesde-total; const pct=Math.min(100,Math.round(total/CONFIG.envioGratisDesde*100)); const c=Store.totalItems(); const el=$("#cartCount"); if(el) el.textContent=c>0?c:""; $("#shipFill").style.width=pct+"%"; $("#shipText").textContent=total===0?`Envío gratis sobre $30.000 • @casacanela.foods`:total<CONFIG.envioGratisDesde?`Te faltan ${fmt(falta)} para envío gratis • @casacanela.foods`:`¡Tienes envío gratis! 🎉 • @casacanela.foods`; $("#dock").classList.toggle("show",c>0); document.body.classList.toggle("has-dock",c>0); if(c>0){$("#dockLabel").textContent=`Ver mi pedido (${c})`; $("#dockTotal").textContent=`${fmt(total)} →`; $("#waFloatWrap").classList.add("hide");} else $("#waFloatWrap").classList.remove("hide"); }
function pintarCarrito(){ const {cart}=Store.getState(); const box=$("#cartItems"), foot=$("#cartFooter"); if(!cart.length){box.innerHTML=`<div class="cart-empty">Tu carrito está vacío.</div>`; foot.innerHTML=""; return;} box.innerHTML=cart.map(it=>{const {p,v}=parseKey(it.key); return `<div class="cart-item"><img src="${p.imagen}"><div class="cart-item-info"><b>${p.nombre}</b><span>${v.gramaje} • ${fmt(v.precio)} c/u</span><div class="qty"><button data-cart-qty="${it.key}" data-delta="-1">−</button><span>${it.qty}</span><button data-cart-qty="${it.key}" data-delta="1">+</button></div></div><div><div class="cart-item-total">${fmt(v.precio*it.qty)}</div><button class="cart-remove" data-remove="${it.key}">Eliminar</button></div></div>`;}).join(""); const total=Store.totalPrecio(); foot.innerHTML=`<div class="cart-row"><span>Subtotal</span><span>${fmt(total)}</span></div><div class="cart-row total"><span>Total</span><span>${fmt(total)}</span></div><button class="btn-wa" id="btnPedirWa">Pedir por WhatsApp →</button><button class="btn-clear" id="btnVaciar">Vaciar carrito</button>`; $("#btnPedirWa").addEventListener("click",Controller.pedirPorWhatsApp); $("#btnVaciar").addEventListener("click",()=>Store.clear()); }
function pintarDetalle(){ const {detailId,selected,detailQty}=Store.getState(); if(!detailId) return; const p=findProducto(detailId); const sel=selected[p.id]||0; const v=p.variantes[sel]; const pills=p.variantes.map((vv,vi)=>`<button class="gram-pill ${vi===sel?"active":""}" data-detail-variante="${vi}" data-id="${p.id}"><b>${vv.gramaje}</b><span>${fmt(vv.precio)}</span></button>`).join(""); $("#detailContent").innerHTML=`<img class="detail-img" src="${p.imagen}"><div class="detail-body"><div style="display:flex;justify-content:space-between;align-items:start"><h2>${p.nombre}</h2><button id="detailClose" style="font-size:24px">×</button></div><div style="font-size:13px;color:var(--gris)">${p.detalle}</div><div class="detail-label">Gramaje</div><div class="gram-pills">${pills}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><div style="font-size:22px;font-weight:800">${fmt(v.precio)}</div><div style="display:flex;gap:10px;align-items:center"><button data-detail-qty="-1" style="width:38px;height:38px;border-radius:50%;background:#F2EBE0;font-size:20px;font-weight:800">−</button><span style="font-weight:800">${detailQty}</span><button data-detail-qty="1" style="width:38px;height:38px;border-radius:50%;background:#F2EBE0;font-size:20px;font-weight:800">+</button></div></div><button class="detail-add" data-detail-add="${p.id}">AÑADIR A LA BOLSA • ${fmt(v.precio*detailQty)}</button></div>`; const c=$("#detailClose"); if(c) c.addEventListener("click",()=>Store.closeDetail()); }
function openDetailUI(){pintarDetalle(); $("#detailOverlay").classList.add("open"); $("#detailDrawer").classList.add("open");} function closeDetailUI(){$("#detailOverlay").classList.remove("open"); $("#detailDrawer").classList.remove("open");}
function render(){pintarProductos(); pintarBarra(); pintarCarrito(); if(Store.getState().detailId) pintarDetalle();}
return{render,openDetailUI,closeDetailUI}; })();
const Controller=(()=>{ function abrirCarrito(){View.render(); $("#cartOverlay").classList.add("open"); $("#cartDrawer").classList.add("open");} function cerrarCarrito(){$("#cartOverlay").classList.remove("open"); $("#cartDrawer").classList.remove("open");} function pedirPorWhatsApp(){ const {cart}=Store.getState(); if(!cart.length) return; const total=Store.totalPrecio(); const lineas=cart.map(it=>{const {p,v}=parseKey(it.key); return `• ${it.qty}x ${p.nombre} (${v.gramaje}) — ${fmt(v.precio*it.qty)}`;}).join("\n"); const msg=`Hola *Casa Canela* 👋 Quiero pedir:\n\n${lineas}\n\n*Total:* ${fmt(total)}\n\n📍 Comuna:\n💳 Pago:`; window.location.href=waBase+"?text="+encodeURIComponent(msg); } function init(){ Store.subscribe(()=>View.render()); document.addEventListener("click",e=>{ const dv=e.target.closest("[data-detail-variante]"); if(dv){Store.setVariante(dv.dataset.id,parseInt(dv.dataset.detailVariante)); return;} const dq=e.target.closest("[data-detail-qty]"); if(dq){Store.setDetailQty(Store.getState().detailQty+parseInt(dq.dataset.detailQty)); return;} const da=e.target.closest("[data-detail-add]"); if(da){const id=da.dataset.detailAdd; const q=Store.getState().detailQty; Store.add(id,q); Store.closeDetail(); showToast(findProducto(id).nombre+" agregado ✓"); return;} const cb=e.target.closest("[data-cart-qty]"); if(cb){Store.changeQty(cb.dataset.cartQty,parseInt(cb.dataset.delta)); return;} const rb=e.target.closest("[data-remove]"); if(rb){Store.remove(rb.dataset.remove); return;} const op=e.target.closest("[data-open]"); if(op){Store.openDetail(op.dataset.open); return;} const chip=e.target.closest(".chip"); if(chip){document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b===chip)); Store.setCategoria(chip.dataset.categoria); return;} }); $("#btnCart").addEventListener("click",abrirCarrito); $("#dockBtn").addEventListener("click",abrirCarrito); $("#btnCloseCart").addEventListener("click",cerrarCarrito); $("#cartOverlay").addEventListener("click",cerrarCarrito); $("#detailOverlay").addEventListener("click",()=>Store.closeDetail()); $("#waFloat").href=waBase+"?text="+encodeURIComponent("Hola Casa Canela! Quiero pedir Granola"); View.render(); } return{init,pedirPorWhatsApp}; })(); Controller.init();
</script>
